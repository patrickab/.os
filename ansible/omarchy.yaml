---
- hosts: localhost
  connection: local
  tasks:
    - name: Import universal tasks
      import_tasks: common.yaml

    # Packages
    - name: Remove unwanted pacman packages
      pacman:
        name:
          - alacritty
          - chromium
          - gnome-calculator
          - signal-desktop
          - easyeffects
          - pinta
          - libreoffice-fresh
          - obsidian
          - typora
        state: absent
      become: yes

    # Config dirs
    - name: Remove unwanted config directories
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/{{ item }}"
        state: absent
      loop:
        - alacritty
        - chromium
        - easyeffects
        - Typora

    # Data / cache dirs
    - name: Remove unwanted data directories
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
        state: absent
      loop:
        - .cache/easyeffects
        - .cache/chromium
        - .local/share/easyeffects
        - .local/share/omarchy/config/Typora

    # Desktop entries
    - name: Remove unwanted user desktop entries
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications/{{ item }}.desktop"
        state: absent
      loop:
        - Alacritty
        - ChatGPT
        - YouTube
        - X
        - Figma
        - Fizzy
        - Google Contacts
        - Google Maps
        - Google Messages
        - Google Photos
        - typora

    # Desktop icons
    - name: Remove unwanted user desktop icons
      file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications/icons/{{ item }}.png"
        state: absent
      loop:
        - ChatGPT
        - Figma
        - Fizzy
        - Google Contacts
        - Google Maps
        - Google Messages
        - Google Photos
        - YouTube
        - X

    # Hyprland bindings
    - name: Remove dead hyprland bindings
      lineinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/hypr/bindings.conf"
        regexp: '{{ item }}'
        state: absent
      loop:
        - 'Signal, exec'
        - 'Typora, exec'
        - 'chatgpt\.com'
        - 'youtube\.com'
        - 'x\.com'
        - 'Google Messages'
        - 'Google Photos'

    # Omarchy-specific packages
    - name: Install Omarchy-specific packages
      pacman:
        name:
          # omarchy utilities go here
        state: present
      become: yes

    # WiFi captive portal setup
    - name: Run wifi redirect setup
      ansible.builtin.shell: "{{ ansible_facts['env']['HOME'] }}/.os/ansible/omarchy/setup_wifi_redirect.sh"
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/captive-browser"
