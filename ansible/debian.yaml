---
- hosts: localhost
  connection: local
  vars:
    docker_obsolete_packages:
      - docker
      - docker.io
      - docker-engine
      - podman-docker
      - containerd
      - runc
      - docker-buildx

  pre_tasks:
    - name: Check whether Docker is already installed
      ansible.builtin.command: sh -c 'command -v docker'
      register: docker_check
      changed_when: false
      failed_when: false

    - when: docker_check.rc != 0
      block:
        - name: Install Docker from official repo via geerlingguy.docker role
          include_role:
            name: geerlingguy.docker

        - name: Fix ~/.docker directory ownership (root created it before user was in docker group)
          file:
            path: "/home/{{ ansible_facts['user_id'] }}/.docker"
            owner: "{{ ansible_facts['user_id'] }}"
            group: "{{ ansible_facts['user_id'] }}"
            recurse: yes
      become: yes

  tasks:
    - name: Import universal tasks
      import_tasks: common.yaml

    - name: Install zstd (needed by the Ollama installer to unpack its release archive)
      ansible.builtin.apt:
        name: zstd
        state: present
      become: yes

    - name: Install Ollama via official install script (creates ollama.service)
      ansible.builtin.shell: set -o pipefail && curl -fsSL https://ollama.com/install.sh | sh
      args:
        executable: /bin/bash
        creates: /usr/local/bin/ollama
      become: yes

    - name: Check whether the Ollama service is installed
      ansible.builtin.command: systemctl cat ollama.service
      register: ollama_check
      changed_when: false
      failed_when: false

    - name: Configure Ollama to listen on all interfaces (Docker bridge needs access)
      when: ollama_check.rc == 0
      become: yes
      block:
        - name: Create Ollama systemd drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/system/ollama.service.d
            state: directory
            mode: '0755'

        - name: Write Ollama override.conf
          ansible.builtin.copy:
            dest: /etc/systemd/system/ollama.service.d/override.conf
            content: |
              [Service]
              Environment="OLLAMA_HOST=0.0.0.0"
            mode: '0644'
          notify: Reload Ollama

  handlers:
    - name: Reload Ollama
      ansible.builtin.systemd:
        name: ollama
        daemon_reload: yes
        state: restarted
      become: yes

    ### DOCKER (via geerlingguy.docker role) ###
    # Debian stable ships outdated Docker packages (docker.io, docker-buildx)
    # that are too old for modern container workflows. As of Debian 12/bookworm,
    # docker-buildx is stuck at 0.13.x while `compose build` requires
    # buildx >= 0.17.0. The geerlingguy.docker role installs from Docker's official
    # APT repo and removes obsolete packages; docker-buildx is appended to the
    # default list so it gets cleaned up before the newer docker-buildx-plugin
    # is installed. Without this, dpkg fails with a file conflict on
    # /usr/libexec/docker/cli-plugins/docker-buildx.

    ### DEBIAN-SPECIFIC PACKAGES ###

    - name: Install Debian-specific packages
      apt:
        name:
          # debian utilities go here
        state: present
      become: yes