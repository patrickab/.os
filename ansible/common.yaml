---
# Dotfile Hooks

- name: Source bashrc_appendix in ~/.bashrc
  lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    line: '[[ -f "$HOME/.bashrc_appendix" ]] && source "$HOME/.bashrc_appendix"'
    state: present
    create: yes
  become: no

# System Packages (cross-distro)
# Autodetect host package manager (apt/pacman) for cross-distro compatibility.

- name: Install universal system packages
  package:
    name:
      - git
      - tmux
      - htop
      - curl
      - wget
      - kitty
      - "{{ 'xclip' if ansible_facts['os_family'] != 'RedHat' else 'xsel' }}"
      - "{{ 'docker' if ansible_facts['os_family'] not in ['Debian', 'RedHat'] else omit }}"
    state: present
  become: yes

# Homebrew Setup & Packages
# Prevent static binary rot via Homebrew. Ensure distro-agnostic user-space installation and automatic updates.

- name: Pre-create Homebrew prefix with proper permissions
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0755'
  loop:
    - /home/linuxbrew
    - /home/linuxbrew/.linuxbrew
    - /home/linuxbrew/.linuxbrew/bin
  become: yes

- name: Check if Homebrew is installed
  stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: brew_check

- name: Install Homebrew
  git:
    repo: https://github.com/Homebrew/brew
    dest: /home/linuxbrew/.linuxbrew/Homebrew
    depth: 1
  when: not brew_check.stat.exists
  become: no

- name: Symlink brew binary
  file:
    src: /home/linuxbrew/.linuxbrew/Homebrew/bin/brew
    dest: /home/linuxbrew/.linuxbrew/bin/brew
    state: link
  when: not brew_check.stat.exists
  become: no

# Uninstall the upstream jandedobbeleer/oh-my-posh tap (its cask has a nil sha256
# and shadows the working homebrew-core formula). Idempotent: ignore failures so
# a fresh box without the tap doesn't break.
- name: Remove broken jandedobbeleer/oh-my-posh tap
  command: /home/linuxbrew/.linuxbrew/bin/brew untap jandedobbeleer/oh-my-posh
  register: untap_omp
  failed_when: false
  changed_when: untap_omp.rc == 0
  become: no

- name: Remove stale oh-my-posh install from prior runs
  command: /home/linuxbrew/.linuxbrew/bin/brew uninstall --force oh-my-posh
  register: uninstall_omp
  failed_when: false
  changed_when: uninstall_omp.rc == 0
  become: no

- name: Install CLI tools via Homebrew
  community.general.homebrew:
    name:
      - uv
      - oh-my-posh
      - bash-preexec
      - atuin
      - opencode
      - yazi
      - neovim
      - ripgrep
      - fd
      - fzf
      - bat
      - eza
      - zoxide
    state: latest
    path: /home/linuxbrew/.linuxbrew/bin
  become: no

# Belt-and-braces: if `brew link` ever drifts again (e.g. upgrade leaves a stale
# opt/ symlink at an old version), force re-link so PATH resolves correctly.
- name: Force-link oh-my-posh so its binary is on PATH
  command: /home/linuxbrew/.linuxbrew/bin/brew link --force oh-my-posh
  register: link_omp
  failed_when: false
  changed_when: "'Linking' in link_omp.stdout or 'Relinking' in link_omp.stdout"
  become: no

- name: Verify oh-my-posh binary is reachable
  command: /home/linuxbrew/.linuxbrew/bin/brew --prefix oh-my-posh
  register: omp_prefix
  changed_when: false
  failed_when: omp_prefix.rc != 0
  become: no

- name: Install Docker via Homebrew (non-Debian/RedHat; Debian/Fedora use geerlingguy.docker role)
  community.general.homebrew:
    name:
      - docker
      - docker-compose
    state: latest
    path: /home/linuxbrew/.linuxbrew/bin
  become: no
  when: ansible_facts['os_family'] not in ['Debian', 'RedHat']

- name: Install fonts via Homebrew
  community.general.homebrew_cask:
    name:
      - font-jetbrains-mono-nerd-font
    state: latest
    install_options: force
    path: /home/linuxbrew/.linuxbrew/bin
  become: no

### System Binaries ###

# Flatpak Packages
# Provide sandboxed, dependency-free GUI installations across distros.

- name: Install flatpak
  package:
    name: flatpak
    state: present
  become: yes

- name: Add Flathub remote
  flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    state: present
  become: no

- name: Install flatpak packages
  flatpak:
    name:
      - com.google.Chrome
      - md.obsidian.Obsidian
    state: present
  become: no
