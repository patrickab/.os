---
# Dotfile Hooks

- name: Source bashrc_appendix in ~/.bashrc
  lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    line: '[[ -f "$HOME/.bashrc_appendix" ]] && source "$HOME/.bashrc_appendix"'
    state: present
    create: yes
  become: no

# System Packages (cross-distro)
# Autodetect host package manager (apt/pacman) for cross-distro compatibility.

- name: Install universal system packages
  package:
    name:
      - git
      - tmux
      - htop
      - curl
      - wget
      - kitty
      - xclip
    state: present
  become: yes

# Homebrew Setup & Packages
# Prevent static binary rot via Homebrew. Ensure distro-agnostic user-space installation and automatic updates.

- name: Pre-create Homebrew directories with proper permissions
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0755'
  loop:
    - /home/linuxbrew
    - /home/linuxbrew/.linuxbrew
    - /home/linuxbrew/.linuxbrew/bin
    - /home/linuxbrew/.linuxbrew/etc
    - /home/linuxbrew/.linuxbrew/include
    - /home/linuxbrew/.linuxbrew/lib
    - /home/linuxbrew/.linuxbrew/sbin
    - /home/linuxbrew/.linuxbrew/share
    - /home/linuxbrew/.linuxbrew/var
    - /home/linuxbrew/.linuxbrew/opt
    - /home/linuxbrew/.linuxbrew/share/zsh
    - /home/linuxbrew/.linuxbrew/share/zsh/site-functions
    - /home/linuxbrew/.linuxbrew/var/homebrew
    - /home/linuxbrew/.linuxbrew/var/homebrew/linked
    - /home/linuxbrew/.linuxbrew/Cellar
    - /home/linuxbrew/.linuxbrew/Caskroom
    - /home/linuxbrew/.linuxbrew/Frameworks
  become: yes

- name: Check if Homebrew is installed
  stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: brew_check

- name: Install Homebrew
  git:
    repo: https://github.com/Homebrew/brew
    dest: /home/linuxbrew/.linuxbrew/Homebrew
    depth: 1
  when: not brew_check.stat.exists
  become: no

- name: Symlink brew binary
  file:
    src: /home/linuxbrew/.linuxbrew/Homebrew/bin/brew
    dest: /home/linuxbrew/.linuxbrew/bin/brew
    state: link
  when: not brew_check.stat.exists
  become: no

- name: Tap oh-my-posh repository
  community.general.homebrew_tap:
    name: jandedobbeleer/oh-my-posh
    state: present
    path: /home/linuxbrew/.linuxbrew/bin
  become: no

- name: Install CLI tools via Homebrew
  community.general.homebrew:
    name:
      - uv
      - jandedobbeleer/oh-my-posh/oh-my-posh
      - atuin
      - opencode
      - ollama
      - yazi
      - neovim
      - ripgrep
      - fd
      - fzf
      - bat
      - eza
      - zoxide
    state: latest
    path: /home/linuxbrew/.linuxbrew/bin
  become: no

- name: Install fonts via Homebrew
  community.general.homebrew_cask:
    name:
      - font-fira-code-nerd-font
    state: latest
    path: /home/linuxbrew/.linuxbrew/bin
  become: no

### System Binaries ###

# Flatpak Packages
# Provide sandboxed, dependency-free GUI installations across distros.

- name: Check for existing obsidian binary
  shell: command -v obsidian
  register: obsidian_check
  failed_when: false
  changed_when: false
  become: no

- name: Install flatpak packages
  flatpak:
    name:
      - md.obsidian.Obsidian
    state: present
  when: obsidian_check.rc != 0
  become: no
