---
# Dotfile Hooks

- name: Source bashrc_appendix in ~/.bashrc
  lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    line: '[[ -f "$HOME/.bashrc_appendix" ]] && source "$HOME/.bashrc_appendix"'
    state: present
    create: yes
  become: no

# System Packages (cross-distro)
# Autodetect host package manager (apt/pacman) for cross-distro compatibility.

- name: Install universal system packages
  package:
    name:
      - git
      - tmux
      - htop
      - curl
      - wget
      - kitty
      - rsync
      - "{{ 'xclip' if ansible_facts['os_family'] != 'RedHat' else 'xsel' }}"
      # Xvfb: virtual X server used by cc-clip's Codex clipboard bridge over SSH.
      - "{{ {'RedHat': 'xorg-x11-server-Xvfb', 'Archlinux': 'xorg-server-xvfb'}.get(ansible_facts['os_family'], 'xvfb') }}"
      - "{{ 'docker' if ansible_facts['os_family'] not in ['Debian', 'RedHat'] else omit }}"
    state: present
  become: yes

- name: Install latest CMake
  package:
    name: cmake
    state: latest
  become: yes

# Mise Setup
# Distro-agnostic version manager used for AI CLI tools (pi, oh-my-pi) that
# aren't reliably packaged in Homebrew. Installed via the official installer
# script so it doesn't depend on Homebrew being present.

- name: Check if mise is installed
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
  register: mise_binary

- name: Install mise
  ansible.builtin.shell: curl -fsSL https://mise.run | sh
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
  become: no
  when: not mise_binary.stat.exists

# Homebrew Setup & Packages
# Prevent static binary rot via Homebrew. Ensure distro-agnostic user-space installation and automatic updates.

- name: Pre-create Homebrew prefix with proper permissions
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0755'
  loop:
    - /home/linuxbrew
    - /home/linuxbrew/.linuxbrew
    - /home/linuxbrew/.linuxbrew/bin
  become: yes

- name: Check if Homebrew is installed
  stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: brew_check

- name: Install Homebrew
  git:
    repo: https://github.com/Homebrew/brew
    dest: /home/linuxbrew/.linuxbrew/Homebrew
    depth: 1
  when: not brew_check.stat.exists
  become: no

- name: Symlink brew binary
  file:
    src: /home/linuxbrew/.linuxbrew/Homebrew/bin/brew
    dest: /home/linuxbrew/.linuxbrew/bin/brew
    state: link
  when: not brew_check.stat.exists
  become: no

- name: Check if oh-my-posh is installed
  stat:
    path: /home/linuxbrew/.linuxbrew/bin/oh-my-posh
  register: omp_binary

- name: Remove broken jandedobbeleer/oh-my-posh tap
  command: /home/linuxbrew/.linuxbrew/bin/brew untap jandedobbeleer/oh-my-posh
  register: untap_omp
  failed_when: false
  changed_when: untap_omp.rc == 0
  become: no
  when: not omp_binary.stat.exists

- name: Install oh-my-posh via Homebrew
  community.general.homebrew:
    name: oh-my-posh
    state: latest
    path: /home/linuxbrew/.linuxbrew/bin
  become: no
  when: not omp_binary.stat.exists

- name: Install CLI tools via Homebrew
  community.general.homebrew:
    name:
      - uv
      - bash-preexec
      - atuin
      - opencode
      - yazi
      - neovim
      - ripgrep
      - fd
      - fzf
      - bat
      - eza
      - zoxide
      - gh
      - repomix
    state: latest
    path: /home/linuxbrew/.linuxbrew/bin
  become: no

- name: Install pi CLI via mise (distro-agnostic GitHub release binary)
  ansible.builtin.command:
    cmd: mise use --global pi@latest
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['HOME'] }}/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
  become: no

- name: Install oh-my-pi via mise (distro-agnostic GitHub release binary)
  ansible.builtin.command:
    cmd: mise use --global "github:can1357/oh-my-pi@latest"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['HOME'] }}/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
  become: no

- name: Install rulesync (agentsync) via uv for cross-agent config sync
  ansible.builtin.command:
    cmd: uv tool install rulesync
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/rulesync"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['HOME'] }}/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
  become: no

- name: Install Pi packages
  ansible.builtin.command:
    cmd: pi install npm:pi-compact-transcript
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.local/bin:{{ ansible_facts['env']['HOME'] }}/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
  ignore_errors: yes
  become: no

- name: Install Docker via Homebrew (non-Debian/RedHat; Debian/Fedora use geerlingguy.docker role)
  community.general.homebrew:
    name:
      - docker
      - docker-compose
    state: latest
    path: /home/linuxbrew/.linuxbrew/bin
  become: no
  when: ansible_facts['os_family'] not in ['Debian', 'RedHat']

- name: Install fonts via Homebrew
  community.general.homebrew_cask:
    name:
      - font-jetbrains-mono-nerd-font
    state: latest
    install_options: force
    path: /home/linuxbrew/.linuxbrew/bin
  become: no

### System Binaries ###

# Flatpak Packages
# Provide sandboxed, dependency-free GUI installations across distros.

- name: Install flatpak
  package:
    name: flatpak
    state: present
  become: yes

- name: Add Flathub remote
  flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    state: present
  become: no

- name: Install flatpak packages
  flatpak:
    name:
      - com.google.Chrome
      - md.obsidian.Obsidian
      - com.vivaldi.Vivaldi
      - com.rafaelmardojai.Blanket
    state: present
  become: no
