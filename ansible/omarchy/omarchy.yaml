---
- name: Omarchy Setup
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Ensure omarchy ansible directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.os/ansible/omarchy"
        state: directory
        mode: '0755'

    - name: Execute WiFi Redirect Setup Script
      ansible.builtin.command:
        cmd: "{{ ansible_env.HOME }}/.os/ansible/omarchy/setup_wifi_redirect.sh"
      args:
        # This makes the task idempotent: it will only run if captive-browser isn't built yet
        creates: "{{ ansible_env.HOME }}/.local/bin/captive-browser"
      register: wifi_redirect_setup
      changed_when: wifi_redirect_setup.rc == 0

    - name: Display setup status
      ansible.builtin.debug:
        msg: "WiFi Redirect setup executed successfully."
      when: wifi_redirect_setup.changed
