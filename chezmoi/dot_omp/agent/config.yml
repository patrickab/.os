setupVersion: 2
symbolPreset: nerd
theme:
  dark: oh-lucy-evening-custom
  light: oh-lucy-evening-custom
composer:
  shape: borderless
statusLine:
  preset: custom
  separator: pipe
  contextLine: "off"
  sessionAccent: false
  compactThinkingLevel: true
  showHookStatus: false
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - status
    - cost
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
modelRoles:
  default: anthropic/claude-sonnet-5:medium
tui:
  textSizing: false
  codexResetFireworks: true
  tight: false
display:
  shimmer: classic
  hideToolActivity: true
  showTokenUsage: false
  showTurnTime: true
hideThinkingBlock: true
includeModelInPrompt: true
includeWorkspaceTree: false
retry:
  waitForUsageReset: false
  usageAwareFallback: false
steeringMode: one-at-a-time
interruptMode: immediate
error:
  notify: "on"
stt:
  enabled: false
computer:
  enabled: false
task:
  eager: default
startup:
  quiet: true