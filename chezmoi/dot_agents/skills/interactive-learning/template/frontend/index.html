<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5eee0" />
    <script>
      // Resolve the saved preference before the first paint. Keep the key in sync with src/lib/theme.tsx.
      (function () {
        var preference = 'system'
        try {
          var saved = localStorage.getItem('interactive-learning-theme')
          if (saved === 'light' || saved === 'dark') preference = saved
        } catch (error) { /* Storage can be unavailable in private or restricted contexts. */ }
        var dark = preference === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : preference === 'dark'
        document.documentElement.dataset.themePreference = preference
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#161410' : '#f5eee0'
      })()
    </script>
    <meta name="description" content="Interactive lesson." />
    <title>Interactive learning</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
