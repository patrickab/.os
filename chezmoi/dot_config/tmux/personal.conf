# Personal tmux overrides — sourced at the end of Omarchy's tmux.conf.
#
# Omarchy owns ~/.config/tmux/tmux.conf and patches it in place on update,
# so it is deliberately NOT chezmoi-managed (see .chezmoiignore). Put personal
# settings here instead: this file is sourced last, so it wins.

# Prefix: keep Ctrl+Space, but leave Ctrl+b working too.
# Matches Omarchy's current default; stated here so it survives an upstream change.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Remote hosts without tmux-256color terminfo get a TERM that disables colors in bash.
# Fall back to screen-256color there (later directive wins over tmux.conf).
if-shell "! infocmp tmux-256color >/dev/null 2>&1" 'set -g default-terminal "screen-256color"'
