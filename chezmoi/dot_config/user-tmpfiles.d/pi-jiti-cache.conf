# Keep pi's extension compile cache across reboots.
# The pi release binary (installed by Omarchy via mise) lets jiti cache compiled
# extensions in /tmp/jiti. /tmp is tmpfs, so every boot recompiled all
# extensions: the first `pi` took ~60s (vs ~6s) and ignored Ctrl+C.
# Upstream: https://github.com/earendil-works/pi/issues/9865
# Delete this file once pi stores the cache outside /tmp.
L /tmp/jiti - - - - %h/.cache/jiti
