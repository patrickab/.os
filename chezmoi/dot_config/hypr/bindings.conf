# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Unify move-focus and group-cycling on the same arrow keys (Pop!_OS style):
# if the active window is part of a group, cycle the group instead of moving focus.
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN
bindd = SUPER, LEFT, Focus left / cycle group back, exec, hypr-smart-focus.sh l
bindd = SUPER, RIGHT, Focus right / cycle group forward, exec, hypr-smart-focus.sh r
bindd = SUPER, UP, Focus up / cycle group back, exec, hypr-smart-focus.sh u
bindd = SUPER, DOWN, Focus down / cycle group forward, exec, hypr-smart-focus.sh d

# Unify group join/eject on SUPER+SHIFT+arrow (Pop!_OS style):
# grouped window -> eject; ungrouped window -> merge into the neighbor.
# Replaces plain swapwindow and makes the dedicated SUPER+ALT+arrow join binds redundant.
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN
unbind = SUPER ALT, LEFT
unbind = SUPER ALT, RIGHT
unbind = SUPER ALT, UP
unbind = SUPER ALT, DOWN
bindd = SUPER SHIFT, LEFT, Join group left / eject, exec, hypr-smart-group.sh l
bindd = SUPER SHIFT, RIGHT, Join group right / eject, exec, hypr-smart-group.sh r
bindd = SUPER SHIFT, UP, Join group up / eject, exec, hypr-smart-group.sh u
bindd = SUPER SHIFT, DOWN, Join group down / eject, exec, hypr-smart-group.sh d

# Plain window position swap on SUPER+ALT+arrow (now free - its old job,
# joining a group, moved to SUPER+SHIFT+arrow above). Native dispatcher,
# no script needed: useful for rearranging tiles, and for the manual
# two-step workaround around Hyprland's split-target group merge limitation
# (unify a split side into one tile via SUPER+SHIFT+arrow, then swap/merge
# the other window in).
bindd = SUPER ALT, LEFT, Swap window left, swapwindow, l
bindd = SUPER ALT, RIGHT, Swap window right, swapwindow, r
bindd = SUPER ALT, UP, Swap window up, swapwindow, u
bindd = SUPER ALT, DOWN, Swap window down, swapwindow, d

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

